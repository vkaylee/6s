name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
      - name: Install Go vulnerability scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      - name: Server lint
        run: ./leedevkit test server --lint-only
      - name: Server unit tests
        run: ./leedevkit test server --unit-only
      - name: Go vulnerability scan
        run: ./scripts/security-scan.sh go

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install LeeDevKit 0.7.7 source distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          curl -fsSL https://github.com/vkaylee/leedevkit/archive/refs/tags/v0.7.7.tar.gz -o "$archive"
          mkdir .leedevkit
          tar -xzf "$archive" --strip-components=1 -C .leedevkit
          rm "$archive"
          DEVKIT_HOME="$PWD/.leedevkit" python3 .leedevkit/scripts/_devkit_integrity.py checksum
          printf '%s\n' '#!/bin/bash' 'exec "$(cd "$(dirname "$0")" && pwd)/.leedevkit/bin/leedevkit" "$@"' > leedevkit
          chmod +x leedevkit
      - uses: oven-sh/setup-bun@4bc047ad259df6fc24a6c9b0f9a0cb08cf17fbe5 # v2.0.1
        with:
          bun-version: '1.4.1'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Web production build
        working-directory: web
        run: bun run build
      - name: Web lint
        run: ./leedevkit test web --lint-only
      - name: Web unit tests
        run: ./leedevkit test web --unit-only
      - name: Web E2E
        run: ./leedevkit test web --e2e-only
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: e2e-failure-reports
          path: artifacts/e2e/
          retention-days: 3
          if-no-files-found: ignore
      - name: OpenAPI drift
        working-directory: web
        run: bun run openapi:drift
      - name: Web vulnerability scan
        run: ./scripts/security-scan.sh web

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
      - name: Install pinned security scanners
        run: |
          go install github.com/anchore/syft/cmd/syft@v1.18.1
          go install github.com/zricethezav/gitleaks/v8@v8.24.2
      - name: Generate SBOM
        run: ./scripts/security-scan.sh sbom
      - name: Secret scan
        run: ./scripts/security-scan.sh secrets
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: security-reports
          path: artifacts/security/
          if-no-files-found: ignore
