name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
      - name: Install LeeDevKit v0.17.0
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://raw.githubusercontent.com/vkaylee/leedevkit/1fd4fce9433efa226f946a10b37f02c2f04bceb6/install.sh -o "$installer"
          printf '%s  %s\n' 'bf434c6bbfadeb60143fefa775b620b233264e2336ab38d664720c3cb8fef9e9' "$installer" | sha256sum -c -
          bash "$installer" v0.17.0
          echo "$HOME/.leedevkit/current/bin" >> "$GITHUB_PATH"
      - name: Build pinned security scanner image
        run: docker build -f .compose/Dockerfile.golang -t 6s-go-dev:1.26 .
      - name: Ensure embedded web dist placeholder
        run: mkdir -p web/dist && printf '<!doctype html>\n' > web/dist/index.html
      - name: Server lint
        run: leedevkit test server --lint-only
      - name: Server unit tests
        run: leedevkit test server --unit-only
      - name: Go vulnerability scan
        env:
          CONTAINER_RUNTIME: docker
        run: ./scripts/security-scan.sh go


  postgres-migrations:
    name: PostgreSQL migration regressions
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test -d test"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build pinned Go runner image
        run: docker build -f .compose/Dockerfile.golang -t 6s-go-dev:1.26 .
      - name: Run PostgreSQL migration regressions
        env:
          CONTAINER_RUNTIME: docker
          TEST_DB_DSN: postgres://test:test_password@127.0.0.1:5432/test?sslmode=disable
          GO_NETWORK: host
        run: ./scripts/_go.sh test ./internal/database -run '^TestPostgres' -count=1
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install LeeDevKit v0.17.0
        shell: bash
        run: |
          set -euo pipefail
          installer="$(mktemp)"
          trap 'rm -f "$installer"' EXIT
          curl -fsSL https://raw.githubusercontent.com/vkaylee/leedevkit/1fd4fce9433efa226f946a10b37f02c2f04bceb6/install.sh -o "$installer"
          printf '%s  %s\n' 'bf434c6bbfadeb60143fefa775b620b233264e2336ab38d664720c3cb8fef9e9' "$installer" | sha256sum -c -
          bash "$installer" v0.17.0
          echo "$HOME/.leedevkit/current/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.1'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Web production build
        working-directory: web
        run: bun run build
      - name: Web lint
        run: leedevkit test web --lint-only
      - name: Web unit tests
        run: leedevkit test web --unit-only
      - name: Web E2E
        run: leedevkit test web --e2e-only
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-reports
          path: artifacts/e2e/
          retention-days: 3
          if-no-files-found: ignore
      - name: OpenAPI drift
        working-directory: web
        run: bun run openapi:drift
      - name: Web vulnerability scan
        run: ./scripts/security-scan.sh web

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
      - name: Build pinned security scanner image
        run: docker build -f .compose/Dockerfile.golang -t 6s-go-dev:1.26 .
      - name: Generate SBOM
        env:
          CONTAINER_RUNTIME: docker
        run: ./scripts/security-scan.sh sbom
      - name: Secret scan
        env:
          CONTAINER_RUNTIME: docker
        run: ./scripts/security-scan.sh secrets
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: artifacts/security/
          if-no-files-found: ignore

  image:
    name: Build & scan app image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Capture build metadata
        run: echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
      - name: Build app image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: .compose/Dockerfile.app
          # load:true keeps the image in the local daemon for trivy + SBOM.
          # Registry push is intentionally NOT wired yet (build & attest only).
          push: false
          load: true
          tags: |
            6s-app:ci-${{ github.sha }}
            6s-app:ci
          build-args: |
            VERSION=ci-${{ github.sha }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ env.BUILD_DATE }}
            SOURCE=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan image (CRITICAL/HIGH block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 6s-app:ci-${{ github.sha }}
          format: sarif
          output: artifacts/security/trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - name: Generate image SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 6s-app:ci-${{ github.sha }}
          format: cyclonedx
          output: artifacts/security/image-sbom.cdx.json
      - name: Upload image scan artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reports
          path: artifacts/security/
          if-no-files-found: ignore
