name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Server lint
        run: ./leedevkit test server --lint-only
      - name: Server unit tests
        run: ./leedevkit test server --unit-only
      - name: Go vulnerability scan
        run: ./scripts/security-scan.sh go

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.1'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Web lint
        run: ./leedevkit test web --lint-only
      - name: Web unit tests
        run: ./leedevkit test web --unit-only
      - name: Web E2E
        working-directory: web
        run: bunx playwright install --with-deps chromium && bunx playwright test
      - name: Web vulnerability scan
        run: ./scripts/security-scan.sh web

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM
        run: ./scripts/security-scan.sh sbom
      - name: Secret scan
        run: ./scripts/security-scan.sh secrets
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: artifacts/security/
          if-no-files-found: ignore
