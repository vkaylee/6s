name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          check-latest: false
      - name: Server lint
        run: ./leedevkit test server --lint-only
      - name: Server unit tests
        run: ./leedevkit test server --unit-only
      - name: Go vulnerability scan
        run: ./scripts/security-scan.sh go

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install LeeDevKit 0.7.7 source distribution
        shell: bash
        run: |
          set -euo pipefail
          archive="$(mktemp)"
          curl -fsSL https://github.com/vkaylee/leedevkit/archive/refs/tags/v0.7.7.tar.gz -o "$archive"
          mkdir .leedevkit
          tar -xzf "$archive" --strip-components=1 -C .leedevkit
          rm "$archive"
          DEVKIT_HOME="$PWD/.leedevkit" python3 .leedevkit/scripts/_devkit_integrity.py checksum
          printf '%s\n' '#!/bin/bash' 'exec "$(cd "$(dirname "$0")" && pwd)/.leedevkit/bin/leedevkit" "$@"' > leedevkit
          chmod +x leedevkit
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.1'
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Web lint
        run: ./leedevkit test web --lint-only
      - name: Web unit tests
        run: ./leedevkit test web --unit-only
      - name: Web E2E
        run: ./leedevkit test web --e2e-only
      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-reports
          path: artifacts/e2e/
          retention-days: 3
          if-no-files-found: ignore
      - name: OpenAPI drift
        working-directory: web
        run: bun run openapi:drift
      - name: Web vulnerability scan
        run: ./scripts/security-scan.sh web

  supply-chain:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generate SBOM
        run: ./scripts/security-scan.sh sbom
      - name: Secret scan
        run: ./scripts/security-scan.sh secrets
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: artifacts/security/
          if-no-files-found: ignore
