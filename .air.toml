root = "."
tmp_dir = "tmp"

[build]
cmd = "./scripts/build-go.sh"
bin = "./tmp/main"
include_ext = ["go", "tpl", "tmpl", "html"]
include_file = [".air-web-trigger"]
exclude_dir = [".git", "tmp", "web", ".leedevkit", ".agent", ".claude", "data", "migrations"]
include_dir = ["cmd", "internal", "queries"]
delay = 500
kill_delay = "500ms"
log = "build-errors.log"
stop_on_error = false

[log]
time = true

[misc]
clean_on_exit = true
