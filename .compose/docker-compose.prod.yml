# =============================================================================
# 6S — Staging / Production stack
# =============================================================================
# Production-shaped runtime: the immutable app image (built from
# .compose/Dockerfile.app) + Postgres over TLS + Caddy terminating TLS.
#
# Differences from dev (intentional, for prod parity):
#   - App runs the COMPILED binary in a slim non-root image, NOT hot-reload.
#   - NO DEV_INSECURE: DB_DSN is assembled here with sslmode=require, and
#     Postgres serves a self-signed cert generated by its own entrypoint.
#   - Secrets (JWT_SECRET, APP_ENCRYPTION_KEY, DB_PASSWORD) come from the
#     environment / .env.prod and FAIL CLOSED if missing (`${VAR:?...}`).
#
# Quick start:
#   cp .env.prod.example .env.prod      # then fill in real secrets
#   podman compose --env-file .env.prod -f .compose/docker-compose.prod.yml up -d --build
#   # open https://localhost:${PROD_HTTPS_PORT:-8444}  (trust the internal CA cert)
#
# Notes:
#   - Self-contained: TLS material is generated inside the db container at
#     startup, so there is no extra init container / dependency chain
#     (podman-compose handles `service_completed_successfully` poorly).
#   - This file is standalone; `leedevkit manage` only drives dev/test.
# =============================================================================

name: ${COMPOSE_PROJECT_NAME:-6s-prod}

services:
  db:
    # bookworm variant: ships openssl (the alpine variant does not).
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required (set it in .env.prod)}
      POSTGRES_DB: ${DB_NAME:-6s_db}
      # Data lives under PGDATA so it survives alongside the named volume.
      PGDATA: /var/lib/postgresql/data/pgdata
    # Generate a self-signed server cert on first start, then hand off to the
    # stock postgres entrypoint with TLS enabled. Runs as root, so it can chown
    # the key to the postgres user before privileges are dropped.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /tls
        if [ ! -f /tls/server.key ] || [ ! -f /tls/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tls/server.key -out /tls/server.crt -days 365 \
            -subj "/CN=db" \
            -addext "subjectAltName=DNS:db,DNS:localhost,IP:127.0.0.1"
          echo "Generated self-signed Postgres certificate."
        fi
        chown postgres:postgres /tls/server.key /tls/server.crt
        chmod 0600 /tls/server.key
        chmod 0644 /tls/server.crt
        exec docker-entrypoint.sh postgres \
          -c ssl=on \
          -c ssl_cert_file=/tls/server.crt \
          -c ssl_key_file=/tls/server.key
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-tls:/tls
    healthcheck:
      # pg_isready over the local unix socket; TLS is verified by clients.
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-6s_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks:
      - 6s-prod-network

  server:
    image: ${APP_IMAGE:-localhost/6s-app}:${APP_TAG:-prod}
    build:
      context: ..
      dockerfile: .compose/Dockerfile.app
      args:
        VERSION: ${APP_TAG:-prod}
        REVISION: ${GIT_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SERVER_PORT: "8080"
      DATA_DIR: /data
      # Assembled here so sslmode=require is guaranteed (no plaintext fallback,
      # no DEV_INSECURE). pgx with sslmode=require encrypts but does not verify
      # the CA, so the self-signed staging cert is accepted.
      DB_DSN: postgres://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD is required}@db:5432/${DB_NAME:-6s_db}?sslmode=require
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 bytes; set it in .env.prod)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required (base64 32-byte key; set it in .env.prod)}
      # Caddy is the trusted edge; it is the only client of the server.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - app-data:/data
    networks:
      - 6s-prod-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2.8.4
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      # Consumed by Caddyfile.prod's {$PROD_HTTPS_PORT} redirect placeholder.
      PROD_HTTPS_PORT: "${PROD_HTTPS_PORT:-443}"
    ports:
      - "${PROD_HTTP_PORT:-8081}:80"
      - "${PROD_HTTPS_PORT:-8444}:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - 6s-prod-network

networks:
  6s-prod-network:

volumes:
  db-tls:
    name: 6s-prod-db-tls
  postgres-data:
    name: 6s-prod-postgres-data
  app-data:
    name: 6s-prod-app-data
  caddy-data:
    name: 6s-prod-caddy-data
  caddy-config:
    name: 6s-prod-caddy-config
