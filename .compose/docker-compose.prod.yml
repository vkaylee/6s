# =============================================================================
# 6S — Staging / Production stack
# =============================================================================
# The role-provisioner and migrator are one-shot release steps. They must
# complete before the runtime server is admitted by the edge proxy.

name: ${COMPOSE_PROJECT_NAME:-6s-prod}

services:
  db:
    # bookworm variant: ships openssl (the alpine variant does not).
    image: docker.io/library/postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required (set it in .env.prod)}
      POSTGRES_DB: ${DB_NAME:-6s_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /tls
        if [ ! -f /tls/server.key ] || [ ! -f /tls/server.crt ]; then
          openssl req -x509 -newkey rsa:2048 -nodes -keyout /tls/server.key -out /tls/server.crt -days 365 -subj "/CN=db" -addext "subjectAltName=DNS:db,DNS:localhost,IP:127.0.0.1"
        fi
        chown postgres:postgres /tls/server.key /tls/server.crt
        chmod 0600 /tls/server.key
        chmod 0644 /tls/server.crt
        exec docker-entrypoint.sh postgres -c ssl=on -c ssl_cert_file=/tls/server.crt -c ssl_key_file=/tls/server.key
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - db-tls:/tls
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ADMIN_USER:-postgres} -d ${DB_NAME:-6s_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    networks: [6s-prod-network]

  role-provisioner:
    image: docker.io/library/postgres:18
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_ADMIN_USER:-postgres}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required (set it in .env.prod)}
      PGDATABASE: ${DB_NAME:-6s_db}
      MIGRATOR_USER: ${MIGRATOR_USER:-6s_migrator}
      RUNTIME_USER: ${RUNTIME_USER:-6s_runtime}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD is required (set it in .env.prod)}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?RUNTIME_PASSWORD is required (set it in .env.prod)}
    volumes:
      - ./provision-runtime-role.sql:/provision.sql:ro
    command: ["sh", "-ec", "psql -v ON_ERROR_STOP=1 -v migrator_user=\"$$MIGRATOR_USER\" -v runtime_user=\"$$RUNTIME_USER\" -v dbname=\"$$PGDATABASE\" -f /provision.sql"]
    networks: [6s-prod-network]

  migrator:
    image: ${APP_IMAGE:-localhost/6s-app}:${APP_TAG:-prod}
    restart: "no"
    depends_on:
      role-provisioner:
        condition: service_completed_successfully
    environment:
      MIGRATION_DB_DSN: postgres://${MIGRATOR_USER:-6s_migrator}:${MIGRATOR_PASSWORD:?MIGRATOR_PASSWORD is required}@db:5432/${DB_NAME:-6s_db}?sslmode=require
      MIGRATION_LOCK_TIMEOUT: ${MIGRATION_LOCK_TIMEOUT:-30s}
      MIGRATION_STATEMENT_TIMEOUT: ${MIGRATION_STATEMENT_TIMEOUT:-5m}
      MIGRATION_TIMEOUT: ${MIGRATION_TIMEOUT:-10m}
    entrypoint: ["migrate"]
    command: ["up"]
  ledger-protector:
    image: docker.io/library/postgres:18
    restart: "no"
    depends_on:
      migrator:
        condition: service_completed_successfully
    environment:
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${DB_ADMIN_USER:-postgres}
      PGPASSWORD: ${DB_ADMIN_PASSWORD:?DB_ADMIN_PASSWORD is required (set it in .env.prod)}
      PGDATABASE: ${DB_NAME:-6s_db}
      RUNTIME_USER: ${RUNTIME_USER:-6s_runtime}
    volumes:
      - ./protect-runtime-role.sql:/protect.sql:ro
    command: ["sh", "-ec", "psql -v ON_ERROR_STOP=1 -f /protect.sql"]
    networks: [6s-prod-network]

  server:
    image: ${APP_IMAGE:-localhost/6s-app}:${APP_TAG:-prod}
    build:
      context: ..
      dockerfile: .compose/Dockerfile.app
      args:
        VERSION: ${APP_TAG:-prod}
        REVISION: ${GIT_REVISION:-unknown}
    restart: unless-stopped
    depends_on:
      ledger-protector:
        condition: service_completed_successfully
    environment:
      SERVER_PORT: "8080"
      DATA_DIR: /data
      DB_DSN: postgres://${RUNTIME_USER:-6s_runtime}:${RUNTIME_PASSWORD:?RUNTIME_PASSWORD is required}@db:5432/${DB_NAME:-6s_db}?sslmode=require
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required (min 32 bytes; set it in .env.prod)}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?APP_ENCRYPTION_KEY is required (base64 32-byte key; set it in .env.prod)}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.1}
    volumes:
      - app-data:/data
    networks: [6s-prod-network]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s

  caddy:
    image: docker.io/library/caddy:2.8.4
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      PROD_HTTPS_PORT: "${PROD_HTTPS_PORT:-443}"
    ports:
      - "${PROD_HTTP_PORT:-8081}:80"
      - "${PROD_HTTPS_PORT:-8444}:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [6s-prod-network]

networks:
  6s-prod-network:

volumes:
  db-tls:
    name: 6s-prod-db-tls
  postgres-data:
    name: 6s-prod-postgres-data
  app-data:
    name: 6s-prod-app-data
  caddy-data:
    name: 6s-prod-caddy-data
  caddy-config:
    name: 6s-prod-caddy-config
