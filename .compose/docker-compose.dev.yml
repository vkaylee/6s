services:
  caddy:
    depends_on:
      server:
        condition: service_healthy
      web:
        condition: service_started

  server:
    depends_on:
      db:
        condition: service_healthy
    # Development-only key; production must provide APP_ENCRYPTION_KEY externally.
    environment:
      APP_ENCRYPTION_KEY: "01234567890123456789012345678901"
