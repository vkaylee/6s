          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/ADConfig'
        '403':
          description: Requires permission `ad:manage` or the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateAdConfig
      summary: Cập nhật cấu hình Active Directory / LDAP vào DB (Requires `ad:manage`)
      requestBody:
        required: true
