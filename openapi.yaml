                - base_dn
                - bind_dn
              properties:
                is_enabled:
                  type: boolean
                server:
                  type: string
                port:
                  type: integer
                use_tls:
                  type: boolean
                skip_tls_verify:
                  type: boolean
                base_dn:
                  type: string
                bind_dn:
                  type: string
                bind_password:
                  type: string
                user_filter:
                  type: string
                group_admin_dn:
                  type: string
                group_safety_dn:
                  type: string
                group_leader_dn:
                  type: string
      responses:
        '200':
          description: Cấu hình AD đã cập nhật và hot-reload thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: boolean
                        example: true

  /config/ad/test:
    post:
      operationId: testAdConfig
      summary: Kiểm tra kết nối và thử bind với Active Directory
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Kiểm tra kết nối thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      success:
                        type: boolean
                        example: true
                      message:
                        type: string
                        example: LDAP connection & service bind OK
        '400':
          description: Kết nối thất bại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

