openapi: 3.1.0
info:
  title: 6S Issue Management & Visual Reporting System API
  version: 1.0.0
  description: API phục vụ ghi nhận, đồng bộ offline, giải quyết và tính điểm sức khỏe 6S trong môi trường nhà xưởng.

servers:
  - url: /api
    description: Runtime-configured API base path

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ISSUE_CONFLICT
        message:
          type: string
          example: Phiên bản issue đã bị thay đổi bởi người dùng khác
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 142

    UserSummary:
      type: object
      required:
        - id
        - username
        - auth_source
        - role
        - capabilities
        - full_name
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: leader_a2
        auth_source:
          type: string
          enum: [LOCAL, AD]
          example: LOCAL
        role:
          type: string
          enum: [USER, LINE_LEADER, SAFETY_OFFICER, ADMIN, SUPERADMIN]
          example: LINE_LEADER
        capabilities:
          type: array
          items:
            type: string
          description: Effective resource:action capabilities. Missing capabilities deny UI access.
          example: [reports:view, issue:close_line]
        assigned_location_code:
          type: string
          nullable: true
          example: LINE_A2
        full_name:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          nullable: true
          example: nva@factory.lan

    Location:
      type: object
      required:
        - code
        - name_vi
        - name_zh
        - name_en
        - qr_code
      properties:
        code:
          type: string
          example: LINE_A1
        name_vi:
          type: string
          example: Chuyền May A1
        name_zh:
          type: string
          example: 缝纫 A1 线
        name_en:
          type: string
          example: Sewing Line A1
        qr_code:
          type: string
          example: LOC:LINE_A1
        is_active:
          type: boolean
          default: true

    Tag:
      type: object
      required:
        - code
        - name_vi
        - name_zh
        - name_en
        - category
        - use_count
      properties:
        code:
          type: string
          example: oil_leak
        name_vi:
          type: string
          example: Rò rỉ dầu
        name_zh:
          type: string
          example: 漏油
        name_en:
          type: string
          example: Oil leak
        category:
          type: string
          enum: [1S, 2S, 3S, 4S, 5S, 6S]
          example: 3S
        use_count:
          type: integer
          example: 45
        is_preset:
          type: boolean
          default: false

    Issue:
      type: object
      required:
        - id
        - client_uuid
        - version
        - creator_id
        - category
        - location_code
        - tags
        - photo_before
        - status
        - created_at
      properties:
        id:
          type: integer
          example: 123
        client_uuid:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        version:
          type: integer
          example: 1
        creator_id:
          type: integer
          example: 12
        resolver_id:
          type: integer
          nullable: true
          example: 15
        category:
          type: string
          enum: [1S, 2S, 3S, 4S, 5S, 6S]
          example: 6S
        location_code:
          type: string
          example: LINE_A1
        tags:
          type: array
          items:
            type: string
          example: ["oil_leak", "safety_gear"]
        description:
          type: string
          nullable: true
          example: Dầu máy chảy ra sàn gần công tắc khẩn cấp
        reject_reason:
          type: string
          nullable: true
          example: Chưa dọn sạch dầu / Dây điện vẫn chưa bọc kỹ
        photo_before:
          type: string
          example: /uploads/before/3fa85f64-5717-4562-b3fc-2c963f66afa6_wide.jpg
        photo_detail:
          type: string
          nullable: true
          example: /uploads/before/3fa85f64-5717-4562-b3fc-2c963f66afa6_detail.jpg
        photo_after:
          type: string
          nullable: true
          example: /uploads/after/7ca85f64-5717-4562-b3fc-2c963f66af99.jpg
        score_rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        status:
          type: string
          enum: [OPEN, PENDING_REVIEW, CLOSED, INVALID]
          example: OPEN
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true

    LocationHealthScore:
      type: object
      required:
        - location_code
        - location_name
        - health_score
        - open_count
        - overdue_count
      properties:
        location_code:
          type: string
          example: LINE_A2
        location_name:
          type: string
          example: Chuyền May A2
        health_score:
          type: integer
          minimum: 0
          maximum: 120
          example: 85
        open_count:
          type: integer
          example: 4
        overdue_count:
          type: integer
          example: 1

    ReporterScore:
      type: object
      required:
        - user_id
        - full_name
        - points
        - valid_count
      properties:
        user_id:
          type: integer
          example: 12
        full_name:
          type: string
          example: Nguyễn Văn A
        points:
          type: integer
          example: 35
        valid_count:
          type: integer
          example: 14
        safety_count:
          type: integer
          example: 3
    LocationMembership:
      type: object
      required: [location_code, user_id, responsibility_type, valid_from, is_active]
      properties:
        location_code:
          type: string
          example: LINE_A1
        user_id:
          type: integer
          example: 4
        username:
          type: string
        full_name:
          type: string
        responsibility_type:
          type: string
          enum: [OWNER, BACKUP, REVIEWER]
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean

    TeamLocation:
      type: object
      required: [team_id, location_code]
      properties:
        team_id:
          type: integer
        location_code:
          type: string
        created_at:
          type: string
          format: date-time
    AIConfig:
      type: object
      required: [is_enabled, base_url, has_api_key, default_model, model_translate, model_vision, model_summary]
      properties:
        is_enabled:
          type: boolean
        base_url:
          type: string
        has_api_key:
          type: boolean
        default_model:
          type: string
        model_translate:
          type: string
        model_vision:
          type: string
        model_summary:
          type: string
        updated_at:
          type: string
          format: date-time
    ADConfig:
      type: object
      required:
        - is_enabled
        - server
        - port
        - use_tls
        - skip_tls_verify
        - base_dn
        - bind_dn
        - user_filter
      properties:
        is_enabled:
          type: boolean
          example: true
        server:
          type: string
          example: ad.factory.lan
        port:
          type: integer
          example: 636
        use_tls:
          type: boolean
          example: true
        skip_tls_verify:
          type: boolean
          example: false
        base_dn:
          type: string
          example: DC=factory,DC=lan
        bind_dn:
          type: string
          example: CN=svc_6s_auth,OU=Services,DC=factory,DC=lan
        has_bind_password:
          type: boolean
          example: true
        user_filter:
          type: string
          example: "(&(objectCategory=person)(objectClass=user)(|(sAMAccountName=%s)(userPrincipalName=%s)))"
        group_admin_dn:
          type: string
          example: CN=6S_Admins,OU=Groups,DC=factory,DC=lan
        group_safety_dn:
          type: string
          example: CN=6S_SafetyOfficers,OU=Groups,DC=factory,DC=lan
        group_leader_dn:
          type: string
          example: CN=6S_LineLeaders,OU=Groups,DC=factory,DC=lan
        updated_at:
          type: string
          format: date-time

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập tài khoản Local hoặc Active Directory / LDAP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: P@ssw0rd123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - access_token
                      - expires_in
                      - refresh_token
                      - refresh_expires_in
                      - user
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_token:
                        type: string
                      refresh_expires_in:
                        type: integer
                        example: 2592000
                      user:
                        $ref: '#/components/schemas/UserSummary'
        '401':
          description: Sai thông tin đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Vượt quá giới hạn thử đăng nhập (Rate limit 5 lần / 1 phút)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/refresh:
    post:
      operationId: refresh
      summary: Cấp mới Access Token bằng Refresh Token (Token Rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token được làm mới thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - access_token
                      - expires_in
                      - refresh_token
                      - refresh_expires_in
                      - user
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_token:
                        type: string
                      refresh_expires_in:
                        type: integer
                        example: 2592000
                      user:
                        $ref: '#/components/schemas/UserSummary'

        '401':
          description: Refresh token đã hết hạn hoặc bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/revoke:
    post:
      operationId: revokeSession
      summary: Thu hồi phiên đăng nhập (Đăng xuất hoặc thu hồi khẩn cấp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token_id:
                  type: integer
                user_id:
                  type: integer
      responses:
        '200':
          description: Thu hồi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        example: true

  /auth/sessions:
    get:
      operationId: listAuthSessions
      summary: Liệt kê các phiên đăng nhập đang hoạt động
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: Chỉ định user_id khi caller là Admin
      responses:
        '200':
          description: Danh sách phiên đăng nhập
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - created_at
                        - expires_at
                      properties:
                        id:
                          type: integer
                          example: 123
                        device_info:
                          type: string
                          nullable: true
                          example: Mobile Safari / iOS 17
                        created_at:
                          type: string
                          format: date-time
                        expires_at:
                          type: string
                          format: date-time
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /locations:
    get:
      operationId: listLocations
      summary: Lấy danh mục vị trí chuẩn hóa (Master Data)
      responses:
        '200':
          description: Danh sách vị trí
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
    post:
      operationId: createLocation
      summary: Thêm mới vị trí (Requires permission `masterdata:manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name_vi
                - name_zh
                - name_en
                - qr_code
              properties:
                code:
                  type: string
                  example: LINE_A3
                name_vi:
                  type: string
                  example: Chuyền May A3
                name_zh:
                  type: string
                  example: 缝纫 A3 线
                name_en:
                  type: string
                  example: Sewing Line A3
                qr_code:
                  type: string
                  example: LOC:LINE_A3
      responses:
        '201':
          description: Vị trí đã được tạo thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /tags:
    get:
      operationId: listTags
      summary: Lấy danh mục tags đa ngôn ngữ theo tần suất sử dụng
      responses:
        '200':
          description: Danh sách tags
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
    post:
      operationId: upsertTag
      summary: Thêm hoặc cập nhật tag (Requires permission `masterdata:manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name_vi
                - name_zh
                - name_en
                - category
              properties:
                code:
                  type: string
                  example: fire_hazard
                name_vi:
                  type: string
                  example: Nguy cơ cháy
                name_zh:
                  type: string
                  example: 火灾隐患
                name_en:
                  type: string
                  example: Fire hazard
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                  example: 6S
      responses:
        '201':
          description: Tag đã được lưu thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tag'

  /issues:
    get:
      operationId: listIssues
      summary: Lấy danh sách issues có phân trang và bộ lọc
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [OPEN, PENDING_REVIEW, CLOSED, INVALID]
        - name: category
          in: query
          schema:
            type: string
            enum: [1S, 2S, 3S, 4S, 5S, 6S]
        - name: location_code
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách issues phân trang
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /issues/{id}:
    get:
      operationId: getIssue
      summary: Xem chi tiết một issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết issue
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '404':
          description: Không tìm thấy issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateIssue
      summary: Sửa nhanh phân loại S hoặc tags khi phát hiện sai
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                location_code:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          description: Không có quyền sửa issue này
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/sync:
    post:
      operationId: syncIssues
      summary: Đồng bộ tạo mới issue từ client (hỗ trợ offline sync với client_uuid)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - client_uuid
                - category
                - location_code
                - photo_before
              properties:
                client_uuid:
                  type: string
                  format: uuid
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                  example: 3S
                location_code:
                  type: string
                  example: LINE_A1
                tags:
                  type: string
                  description: JSON array string, vd '["oil_leak", "safety_gear"]'
                description:
                  type: string
                photo_before:
                  type: string
                  format: binary
                  description: Ảnh toàn cảnh bối cảnh (<= 2MB, JPEG/PNG)
                photo_detail:
                  type: string
                  format: binary
                  description: Ảnh cận cảnh / chú thích (<= 2MB, JPEG/PNG)
      responses:
        '201':
          description: Issue tạo mới thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '200':
          description: Idempotent replay (client_uuid đã tồn tại trước đó)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '413':
          description: File vượt quá dung lượng quy định (Ảnh > 2MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Định dạng file không hợp lệ (Không đúng magic bytes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      summary: Upload ảnh khắc phục (hỗ trợ offline sync với expected_version)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resolved_client_uuid
                - expected_version
                - photo_after
              properties:
                resolved_client_uuid:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  example: 1
                photo_after:
                  type: string
                  format: binary
      responses:
        '200':
          description: Khắc phục thành công, chuyển sang PENDING_REVIEW
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '409':
          description: Xung đột trạng thái hoặc phiên bản (Optimistic Locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/close:
    post:
      operationId: closeIssue
      summary: Duyệt hoàn thành issue và chấm điểm Kaizen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
      responses:
        '200':
          description: Đóng issue thành công, cộng điểm Creator
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          description: Không đủ thẩm quyền đóng issue (ví dụ công nhân không được duyệt 6S Safety)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/reopen:
    post:
      operationId: reopenIssue
      summary: Từ chối duyệt khắc phục, yêu cầu làm lại (Reopen)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject_reason
              properties:
