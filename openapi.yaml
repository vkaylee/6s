                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/UserSummary'
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /admin/assets:
    post:
      operationId: createAdminAsset
      summary: Tạo tài sản/thiết bị (Requires `masterdata:manage`)
      requestBody:
        required: true
        content:
          application/json:
