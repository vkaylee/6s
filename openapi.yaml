          description: Cập nhật trạng thái location
          content:
            application/json:
              schema:
                type: object

  /locations/{code}:
    put:
      operationId: updateLocation
      summary: Cập nhật location (Requires permission `masterdata:manage`)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cập nhật location
          content:
            application/json:
              schema:
                type: object

  /tags/all:
    get:
      operationId: listAllTags
      summary: Danh sách tags (kể cả inactive) cho Admin
      responses:
        '200':
          description: Danh sách tags đầy đủ
          content:
            application/json:
              schema:
                type: object

  /tags/{code}/status:
    patch:
      operationId: updateTagStatus
      summary: Bật/tắt tag (Requires permission `masterdata:manage`)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Cập nhật trạng thái tag
          content:
            application/json:
              schema:
                type: object

  /tags/{code}/review:
    patch:
      operationId: reviewTag
      summary: Duyệt, từ chối hoặc gộp tag chờ duyệt (Requires permission `masterdata:manage`)
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [APPROVE, REJECT, MERGE]
                merged_tag_code:
                  type: string
                  description: Tag đích đã APPROVED khi gộp
      responses:
        '200':
          description: Kết quả cập nhật trạng thái tag
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    $ref: '#/components/schemas/Tag'

  /tags/batch-status:
    post:
      operationId: batchUpdateTagStatus
      summary: Bật/tắt nhiều tag (Requires permission `masterdata:manage`)
      responses:
        '200':
          description: Kết quả cập nhật
          content:
            application/json:
              schema:
                type: object

  /config/notifications:
    get:
      operationId: getNotificationConfig
      summary: Lấy cấu hình kênh thông báo (Admin only)
      responses:
        '200':
          description: Cấu hình thông báo hiện hành
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - wxpusher_enabled
                      - has_app_token
                      - has_webhook_url
                      - public_base_url
                    properties:
                      wxpusher_enabled:
                        type: boolean
                      has_app_token:
                        type: boolean
                      has_webhook_url:
                        type: boolean
                      public_base_url:
                        type: string
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    put:
      operationId: updateNotificationConfig
      summary: Cập nhật cấu hình kênh thông báo (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                wxpusher_enabled:
                  type: boolean
                wxpusher_app_token:
                  type: string
                  description: Token mới (chỉ gửi khi thay đổi)
                lan_webhook_url:
                  type: string
                  description: Webhook URL mới (chỉ gửi khi thay đổi)
                public_base_url:
                  type: string
      responses:
        '200':
          description: Cập nhật cấu hình thông báo thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      updated:
                        type: boolean
                        example: true
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /config/notifications/test:
    post:
      operationId: testNotificationConfig
      summary: Gửi tin nhắn test qua các kênh thông báo đang kích hoạt (Admin only)
      responses:
        '200':
          description: Kết quả test thông báo per-kênh
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    properties:
                      wxpusher:
                        type: object
                        properties:
                          success:
                            type: boolean
                          message:
                            type: string
                      lan_webhook:
                        type: object
                        properties:
                          success:
                            type: boolean
                          message:
                            type: string
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /health:
    get:
      operationId: getHealth
      summary: Kiểm tra tình trạng server và DB (Liveness probe, không cần auth)
      security: []
      responses:
        '200':
          description: Hệ thống hoạt động bình thường
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - status
                      - db
                    properties:
                      status:
                        type: string
                        example: ok
                      db:
                        type: string
                        example: ok
