openapi: 3.1.0
info:
  title: 6S Issue Management & Visual Reporting System API
  version: 1.0.0
  description: API phục vụ ghi nhận, đồng bộ offline, giải quyết và tính điểm sức khỏe 6S trong môi trường nhà xưởng.

servers:
  - url: /api
    description: Runtime-configured API base path

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: ISSUE_CONFLICT
        message:
          type: string
          example: Phiên bản issue đã bị thay đổi bởi người dùng khác
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    TranslationContext:
      type: object
      properties:
        category:
          type: string
        cause_type:
          type: string
        location_code:
          type: string
        location_name:
          type: string
        tags:
          type: array
          items:
            type: string

    PaginationMeta:
      type: object
      required:
        - page
        - limit
        - total
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 20
        total:
          type: integer
          example: 142

    UserSummary:
      type: object
      required:
        - id
        - username
        - auth_source
        - role
        - capabilities
        - full_name
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: leader_a2
        auth_source:
          type: string
          enum: [LOCAL, AD]
          example: LOCAL
        role:
          type: string
          enum: [USER, LINE_LEADER, SAFETY_OFFICER, ADMIN, SUPERADMIN]
          example: LINE_LEADER
        capabilities:
          type: array
          items:
            type: string
          description: Effective resource:action capabilities. Missing capabilities deny UI access.
          example: [reports:view, issue:close_line]
        assigned_location_code:
          type: string
          nullable: true
          example: LINE_A2
        full_name:
          type: string
          example: Nguyễn Văn A
        email:
          type: string
          nullable: true
          example: nva@factory.lan

    Location:
      type: object
      required:
        - code
        - name_vi
        - name_zh
        - name_en
        - qr_code
      properties:
        code:
          type: string
          example: LINE_A1
        name_vi:
          type: string
          example: Chuyền May A1
        name_zh:
          type: string
          example: 缝纫 A1 线
        name_en:
          type: string
          example: Sewing Line A1
        qr_code:
          type: string
          example: LOC:LINE_A1
        is_active:
          type: boolean
          default: true

    Tag:
      type: object
      required:
        - code
        - name_vi
        - name_zh
        - name_en
        - category
        - use_count
      properties:
        code:
          type: string
          example: oil_leak
        name_vi:
          type: string
          example: Rò rỉ dầu
        name_zh:
          type: string
          example: 漏油
        name_en:
          type: string
          example: Oil leak
        category:
          type: string
          enum: [1S, 2S, 3S, 4S, 5S, 6S]
          example: 3S
        use_count:
          type: integer
          example: 45
        is_preset:
          type: boolean
          default: false
        is_active:
          type: boolean
          default: true
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, MERGED]
          default: APPROVED
        created_by:
          type: integer
          nullable: true

    TagDetail:
      type: object
      required:
        - code
        - name_vi
        - name_zh
        - name_en
        - category
        - status
      properties:
        code:
          type: string
          example: oil_leak
        name_vi:
          type: string
          example: Rò rỉ dầu
        name_zh:
          type: string
          example: 漏油
        name_en:
          type: string
          example: Oil leak
        category:
          type: string
          enum: [1S, 2S, 3S, 4S, 5S, 6S]
          example: 3S
        status:
          type: string
          enum: [PENDING, APPROVED, REJECTED, MERGED]
          example: APPROVED
    Issue:
      type: object
      required:
        - id
        - client_uuid
        - version
        - creator_id
        - asset_id
        - assigned_team_id
        - assignee_id
        - cause_team_id
        - cause_status
        - category
        - location_code
        - tags
        - photo_before
        - status
        - created_at
      properties:
        id:
          type: integer
          example: 123
        client_uuid:
          type: string
          format: uuid
          example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
        version:
          type: integer
          example: 1
        creator_id:
          type: integer
          example: 12
        resolver_id:
          type: integer
          nullable: true
          example: 15
        asset_id:
          type: [integer, 'null']
          description: Luôn có mặt; null khi issue không gắn tài sản
        assigned_team_id:
          type: [integer, 'null']
          description: Team xử lý; luôn có mặt, null khi chưa phân công
        assignee_id:
          type: [integer, 'null']
          description: Người xử lý trực tiếp; luôn có mặt, null khi chưa phân công
        cause_team_id:
          type: [integer, 'null']
          description: Team chịu trách nhiệm nguyên nhân; luôn có mặt, không tự suy ra từ team xử lý
        cause_status:
          type: string
          enum: [UNVERIFIED, CONFIRMED, NOT_APPLICABLE]
          description: Trạng thái xác minh nguyên nhân; luôn có mặt, độc lập với cause_type
        responsibility_history:
          type: array
          description: Chỉ có ở GET /api/issues/{id}
          items:
            $ref: '#/components/schemas/ResponsibilityHistoryEntry'
        allowed_actions:
          description: Chỉ có ở GET /api/issues/{id}
          $ref: '#/components/schemas/IssueAllowedActions'
        category:
          type: string
          enum: [1S, 2S, 3S, 4S, 5S, 6S]
          example: 6S
        location_code:
          type: string
          example: LINE_A1
        location_name_vi_snapshot:
          type: string
          nullable: true
          description: Location name in Vietnamese captured with the issue, when available.
        location_name_zh_snapshot:
          type: string
          nullable: true
          description: Location name in Chinese captured with the issue, when available.
        location_name_en_snapshot:
          type: string
          nullable: true
          description: Location name in English captured with the issue, when available.
        location_snapshot_source:
          type: string
          nullable: true
          enum: [CLIENT_CAPTURE, SERVER_CAPTURE]
          description: Provenance of the display snapshot; never used for authorization.
        location_snapshot_recorded_at:
          type: string
          format: date-time
          nullable: true
          description: Server receipt time at which the snapshot was persisted.
        tags:
          type: array
          items:
            type: string
          example: ["oil_leak", "safety_gear"]
        tag_details:
          type: array
          description: Tag metadata and lifecycle status chips for all viewers
          items:
            $ref: '#/components/schemas/TagDetail'
        description:
          type: string
          nullable: true
          example: Dầu máy chảy ra sàn gần công tắc khẩn cấp
        reject_reason:
          type: string
          nullable: true
          example: Chưa dọn sạch dầu / Dây điện vẫn chưa bọc kỹ
        photo_before:
          type: string
          example: /uploads/before/3fa85f64-5717-4562-b3fc-2c963f66afa6_wide.jpg
        photo_detail:
          type: string
          nullable: true
          example: /uploads/before/3fa85f64-5717-4562-b3fc-2c963f66afa6_detail.jpg
        photo_after:
          type: string
          nullable: true
          example: /uploads/after/7ca85f64-5717-4562-b3fc-2c963f66af99.jpg
        score_rating:
          type: integer
          minimum: 1
          maximum: 5
          example: 5
        status:
          type: string
          enum: [OPEN, PENDING_REVIEW, CLOSED, INVALID]
          example: OPEN
        created_at:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true

    LocationHealthScore:
      type: object
      required:
        - location_code
        - location_name
        - health_score
        - open_count
        - overdue_count
      properties:
        location_code:
          type: string
          example: LINE_A2
        location_name:
          type: string
          example: Chuyền May A2
        health_score:
          type: integer
          minimum: 0
          maximum: 120
          example: 85
        open_count:
          type: integer
          example: 4
        overdue_count:
          type: integer
          example: 1

    ReporterScore:
      type: object
      required:
        - user_id
        - full_name
        - points
        - valid_count
      properties:
        user_id:
          type: integer
          example: 12
        full_name:
          type: string
          example: Nguyễn Văn A
        points:
          type: integer
          example: 35
        valid_count:
          type: integer
          example: 14
        safety_count:
          type: integer
          example: 3
    LocationMembership:
      type: object
      required: [location_code, user_id, responsibility_type, valid_from, is_active]
      properties:
        location_code:
          type: string
          example: LINE_A1
        user_id:
          type: integer
          example: 4
        username:
          type: string
        full_name:
          type: string
        responsibility_type:
          type: string
          enum: [OWNER, BACKUP, REVIEWER]
        valid_from:
          type: string
          format: date-time
        valid_to:
          type: string
          format: date-time
          nullable: true
        is_active:
          type: boolean

    TeamLocation:
      type: object
      required: [team_id, location_code]
      properties:
        team_id:
          type: integer
        location_code:
          type: string
        created_at:
          type: string
          format: date-time

    Asset:
      type: object
      required: [id, site_id, location_code, asset_code, name, default_team_id, is_active]
      properties:
        id:
          type: integer
        site_id:
          type: integer
        location_code:
          type: string
        asset_code:
          type: string
        name:
          type: string
        asset_type:
          type: [string, 'null']
        default_team_id:
          type: [integer, 'null']
        is_active:
          type: boolean

    Team:
      type: object
      required: [id, site_id, code, name, is_active]
      properties:
        id:
          type: integer
        site_id:
          type: integer
        code:
          type: string
        name:
          type: string
        is_active:
          type: boolean

    TeamMember:
      type: object
      required: [id, username, full_name, role, is_active]
      properties:
        id:
          type: integer
        username:
          type: string
        full_name:
          type: string
        role:
          type: string
          enum: [USER, LINE_LEADER, SAFETY_OFFICER, ADMIN, SUPERADMIN]
        is_active:
          type: boolean

    ResponsibilityHistoryEntry:
      type: object
      required: [id, action, changed_by, changed_by_name, old_value, new_value, created_at]
      properties:
        id:
          type: integer
        action:
          type: string
          enum: [ASSIGN, TRANSFER, CAUSE_VERIFY, OTHER]
          description: ASSIGN khi có người/đơn vị nhận xử lý; TRANSFER khi đổi người/đơn vị; CAUSE_VERIFY khi xác minh nguyên nhân; OTHER cho thay đổi trách nhiệm khác (ví dụ chỉ đổi tài sản)
        changed_by:
          type: [integer, 'null']
        changed_by_name:
          type: [string, 'null']
        old_value:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        new_value:
          anyOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        created_at:
          type: string
          format: date-time

    IssueAllowedActions:
      type: object
      required: [assign, verify_cause, resolve, close]
      properties:
        assign:
          type: boolean
        verify_cause:
          type: boolean
        resolve:
          type: boolean
        close:
          type: boolean

    TeamKPI:
      type: object
      required: [team_id, team_name, assigned_count, open_count, overdue_count, closed_count, confirmed_cause_count]
      properties:
        team_id:
          type: integer
        team_name:
          type: string
        assigned_count:
          type: integer
        open_count:
          type: integer
        overdue_count:
          type: integer
        closed_count:
          type: integer
        confirmed_cause_count:
          type: integer
    AIConfig:
      type: object
      required: [is_enabled, base_url, has_api_key, default_model, model_translate, model_vision, model_summary]
      properties:
        is_enabled:
          type: boolean
        base_url:
          type: string
        has_api_key:
          type: boolean
        default_model:
          type: string
        model_translate:
          type: string
        model_vision:
          type: string
        model_summary:
          type: string
        updated_at:
          type: string
          format: date-time
    ADConfig:
      type: object
      required:
        - is_enabled
        - server
        - port
        - use_tls
        - skip_tls_verify
        - base_dn
        - bind_dn
        - user_filter
      properties:
        is_enabled:
          type: boolean
          example: true
        server:
          type: string
          example: ad.factory.lan
        port:
          type: integer
          example: 636
        use_tls:
          type: boolean
          example: true
        skip_tls_verify:
          type: boolean
          example: false
        base_dn:
          type: string
          example: DC=factory,DC=lan
        bind_dn:
          type: string
          example: CN=svc_6s_auth,OU=Services,DC=factory,DC=lan
        has_bind_password:
          type: boolean
          example: true
        user_filter:
          type: string
          example: "(&(objectCategory=person)(objectClass=user)(|(sAMAccountName=%s)(userPrincipalName=%s)))"
        group_admin_dn:
          type: string
          example: CN=6S_Admins,OU=Groups,DC=factory,DC=lan
        group_safety_dn:
          type: string
          example: CN=6S_SafetyOfficers,OU=Groups,DC=factory,DC=lan
        group_leader_dn:
          type: string
          example: CN=6S_LineLeaders,OU=Groups,DC=factory,DC=lan
        updated_at:
          type: string
          format: date-time

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      operationId: login
      summary: Đăng nhập tài khoản Local hoặc Active Directory / LDAP
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - password
              properties:
                username:
                  type: string
                  example: admin
                password:
                  type: string
                  example: P@ssw0rd123
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - access_token
                      - expires_in
                      - refresh_token
                      - refresh_expires_in
                      - user
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_token:
                        type: string
                      refresh_expires_in:
                        type: integer
                        example: 2592000
                      user:
                        $ref: '#/components/schemas/UserSummary'
        '401':
          description: Sai thông tin đăng nhập
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Vượt quá giới hạn thử đăng nhập (Rate limit 5 lần / 1 phút)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/refresh:
    post:
      operationId: refresh
      summary: Cấp mới Access Token bằng Refresh Token (Token Rotation)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refresh_token
              properties:
                refresh_token:
                  type: string
      responses:
        '200':
          description: Token được làm mới thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: object
                    required:
                      - access_token
                      - expires_in
                      - refresh_token
                      - refresh_expires_in
                      - user
                    properties:
                      access_token:
                        type: string
                      expires_in:
                        type: integer
                        example: 3600
                      refresh_token:
                        type: string
                      refresh_expires_in:
                        type: integer
                        example: 2592000
                      user:
                        $ref: '#/components/schemas/UserSummary'

        '401':
          description: Refresh token đã hết hạn hoặc bị thu hồi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/revoke:
    post:
      operationId: revokeSession
      summary: Thu hồi phiên đăng nhập (Đăng xuất hoặc thu hồi khẩn cấp)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token_id:
                  type: integer
                user_id:
                  type: integer
      responses:
        '200':
          description: Thu hồi thành công
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      revoked:
                        type: boolean
                        example: true

  /auth/sessions:
    get:
      operationId: listAuthSessions
      summary: Liệt kê các phiên đăng nhập đang hoạt động
      parameters:
        - name: user_id
          in: query
          required: false
          schema:
            type: integer
          description: Chỉ định user_id khi caller là Admin
      responses:
        '200':
          description: Danh sách phiên đăng nhập
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - created_at
                        - expires_at
                      properties:
                        id:
                          type: integer
                          example: 123
                        device_info:
                          type: string
                          nullable: true
                          example: Mobile Safari / iOS 17
                        created_at:
                          type: string
                          format: date-time
                        expires_at:
                          type: string
                          format: date-time
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /locations:
    get:
      operationId: listLocations
      summary: Lấy danh mục vị trí chuẩn hóa (Master Data)
      responses:
        '200':
          description: Danh sách vị trí
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Location'
    post:
      operationId: createLocation
      summary: Thêm mới vị trí (Requires permission `masterdata:manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name_vi
                - name_zh
                - name_en
                - qr_code
              properties:
                code:
                  type: string
                  example: LINE_A3
                name_vi:
                  type: string
                  example: Chuyền May A3
                name_zh:
                  type: string
                  example: 缝纫 A3 线
                name_en:
                  type: string
                  example: Sewing Line A3
                qr_code:
                  type: string
                  example: LOC:LINE_A3
      responses:
        '201':
          description: Vị trí đã được tạo thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Location'
        '403':
          description: Requires the route-specific management permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /tags:
    get:
      operationId: listTags
      summary: Lấy danh mục tags đa ngôn ngữ theo tần suất sử dụng
      responses:
        '200':
          description: Danh sách tags
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Tag'
    post:
      operationId: upsertTag
      summary: Thêm hoặc cập nhật tag (Requires permission `masterdata:manage`)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name_vi
                - name_zh
                - name_en
                - category
              properties:
                code:
                  type: string
                  example: fire_hazard
                name_vi:
                  type: string
                  example: Nguy cơ cháy
                name_zh:
                  type: string
                  example: 火灾隐患
                name_en:
                  type: string
                  example: Fire hazard
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                  example: 6S
      responses:
        '201':
          description: Tag đã được lưu thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Tag'

  /assets:
    get:
      operationId: listAssets
      summary: Danh mục thiết bị/tài sản theo vị trí (yêu cầu đăng nhập)
      parameters:
        - name: site_id
          in: query
          required: false
          description: Chỉ được khác site hiện tại với SUPERADMIN; nếu không sẽ trả 403
          schema:
            type: integer
        - name: location_code
          in: query
          required: false
          schema:
            type: string
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Danh sách thiết bị
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Asset'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: site_id không thuộc phạm vi người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /teams:
    get:
      operationId: listTeams
      summary: Danh mục team của site (yêu cầu đăng nhập)
      parameters:
        - name: site_id
          in: query
          required: false
          description: Chỉ được khác site hiện tại với SUPERADMIN; nếu không sẽ trả 403
          schema:
            type: integer
        - name: location_code
          in: query
          required: false
          description: Lọc team có gán khu vực này
          schema:
            type: string
        - name: is_active
          in: query
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Danh sách team
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Team'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: site_id không thuộc phạm vi người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /teams/{id}/members:
    get:
      operationId: listAssignableTeamMembers
      summary: Thành viên team phục vụ chọn người xử lý (Requires `issue:assign`)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Danh sách thành viên team
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/TeamMember'
        '403':
          description: Thiếu permission `issue:assign`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Team không thuộc site của người dùng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues:
    get:
      operationId: listIssues
      summary: Lấy danh sách issues có phân trang và bộ lọc
      parameters:
        - name: status
          in: query
          description: Chấp nhận cả alias số nhiều `statuses` (giá trị lặp lại hoặc phân tách bằng dấu phẩy)
          schema:
            type: string
            enum: [OPEN, PENDING_REVIEW, CLOSED, INVALID]
        - name: category
          in: query
          description: Chấp nhận cả alias số nhiều `categories`
          schema:
            type: string
            enum: [1S, 2S, 3S, 4S, 5S, 6S]
        - name: location_code
          in: query
          description: Chấp nhận cả alias số nhiều `location_codes`
          schema:
            type: string
        - name: tag_code
          in: query
          required: false
          description: Lọc issue có gắn tag theo mã code
          schema:
            type: string
        - name: overdue
          in: query
          required: false
          description: Chỉ issue OPEN quá 48 giờ
          schema:
            type: boolean
        - name: assigned_team_id
          in: query
          required: false
          schema:
            type: integer
          description: Lọc theo team xử lý
        - name: mine_team
          in: query
          required: false
          schema:
            type: boolean
          description: Chỉ issues được giao cho một team hiện tại của người dùng
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Danh sách issues phân trang
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - pagination
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Issue'
                  pagination:
                    $ref: '#/components/schemas/PaginationMeta'

  /issues/{id}:
    get:
      operationId: getIssue
      summary: Xem chi tiết một issue
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Chi tiết issue
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '404':
          description: Không tìm thấy issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    patch:
      operationId: updateIssue
      summary: Sửa nhanh phân loại S, tags hoặc trách nhiệm; multipart chỉ nhận các trường phân loại/ảnh, trường trách nhiệm và expected_version chỉ qua JSON
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_version:
                  type: integer
                  description: Bắt buộc khi payload có bất kỳ trường trách nhiệm nào; thiếu thì 400, lệch phiên bản thì 409 ISSUE_CONFLICT
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                location_code:
                  type: string
                tags:
                  type: array
                  items:
                    type: string
                asset_id:
                  type: [integer, 'null']
                  description: null để xóa; bỏ qua để giữ nguyên
                assigned_team_id:
                  type: [integer, 'null']
                  description: null để xóa; bỏ qua để giữ nguyên
                assignee_id:
                  type: [integer, 'null']
                  description: null để xóa; bỏ qua để giữ nguyên
                cause_team_id:
                  type: [integer, 'null']
                  description: >-
                    Bắt buộc có issue:verify_cause khi gửi (kể cả null), nếu không trả 403. Bỏ qua để giữ nguyên.
                    Nếu cause_status hiệu lực là UNVERIFIED/NOT_APPLICABLE, cột này bị xóa cùng lúc; gửi kèm giá trị
                    khác null với hai trạng thái đó trả 400. CONFIRMED đòi hỏi team đang hoạt động thuộc site của issue, nếu không 400.
                cause_status:
                  anyOf:
                    - type: string
                      enum: [UNVERIFIED, CONFIRMED, NOT_APPLICABLE]
                    - type: 'null'
                  description: >-
                    Bắt buộc có issue:verify_cause khi gửi (kể cả null hoặc UNVERIFIED), nếu không trả 403. Bỏ qua để
                    giữ nguyên. null đặt lại UNVERIFIED; UNVERIFIED/NOT_APPLICABLE luôn xóa cause_team_id trong cùng
                    giao dịch; CONFIRMED giữ nguyên team hiện có nếu hợp lệ. Giá trị ngoài enum trả 400.
      responses:
        '200':
          description: Cập nhật thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '400':
          description: >-
            Thiếu expected_version cho thay đổi trách nhiệm; cause_status ngoài enum; tổ hợp nguyên nhân không nhất quán
            (UNVERIFIED/NOT_APPLICABLE kèm cause_team_id khác null, hoặc CONFIRMED thiếu team hợp lệ); tài sản/team không
            khớp site hoặc vị trí của issue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: Phiên bản issue đã thay đổi (expected_version lệch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Không có quyền sửa issue này, hoặc thiếu `issue:verify_cause` khi gửi trường nguyên nhân, hoặc thiếu `issue:assign` khi đổi phân công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/sync:
    post:
      operationId: syncIssues
      summary: Đồng bộ tạo mới issue từ client (hỗ trợ offline sync với client_uuid)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - client_uuid
                - category
                - location_code
                - photo_before
              properties:
                client_uuid:
                  type: string
                  format: uuid
                  example: 3fa85f64-5717-4562-b3fc-2c963f66afa6
                category:
                  type: string
                  enum: [1S, 2S, 3S, 4S, 5S, 6S]
                  example: 3S
                location_code:
                  type: string
                  example: LINE_A1
                location_name_vi_snapshot:
                  type: string
                  description: Optional captured Vietnamese location name; display provenance only.
                location_name_zh_snapshot:
                  type: string
                  description: Optional captured Chinese location name; display provenance only.
                location_name_en_snapshot:
                  type: string
                  description: Optional captured English location name; display provenance only.
                location_snapshot_source:
                  type: string
                  enum: [CLIENT_CAPTURE, SERVER_CAPTURE]
                tags:
                  type: string
                  description: JSON array string, vd '["oil_leak", "safety_gear"]'
                proposed_tags:
                  type: string
                  description: JSON array string of {name_vi,name_zh,name_en,category}; up to 5 creator-owned pending tags
                description:
                  type: string
                photo_before:
                  type: string
                  format: binary
                  description: Ảnh toàn cảnh bối cảnh (<= 2MB, JPEG/PNG)
                photo_detail:
                  type: string
                  format: binary
                  description: Ảnh cận cảnh / chú thích (<= 2MB, JPEG/PNG)
                cause_type:
                  type: string
                  enum: [CONDITION, BEHAVIOR]
                asset_id:
                  type: integer
                  description: Tùy chọn; không cần issue:assign, nhưng 400 nếu tài sản không tồn tại/không hoạt động/khác site. Tài sản hợp lệ sẽ gợi ý default_team_id đang hoạt động khi không gửi assigned_team_id.
                assigned_team_id:
                  type: integer
                  description: Tùy chọn; gửi trường này cần issue:assign, nếu không trả 403. Team không hoạt động hoặc khác site trả 400.
                assignee_id:
                  type: integer
                  description: Tùy chọn; gửi trường này cần issue:assign, nếu không trả 403. Người dùng phải thuộc team hiệu lực, nếu không trả 400.
      responses:
        '201':
          description: Issue tạo mới thành công
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '200':
          description: Idempotent replay (client_uuid đã tồn tại trước đó)
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '400':
          description: Tài sản/team/người xử lý không hợp lệ, không hoạt động, khác site, hoặc người xử lý không thuộc team hiệu lực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: Gửi assigned_team_id hoặc assignee_id nhưng thiếu permission `issue:assign`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '413':
          description: File vượt quá dung lượng quy định (Ảnh > 2MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '415':
          description: Định dạng file không hợp lệ (Không đúng magic bytes)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/resolve:
    post:
      operationId: resolveIssue
      summary: Upload ảnh khắc phục (hỗ trợ offline sync với expected_version)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - resolved_client_uuid
                - expected_version
                - photo_after
              properties:
                resolved_client_uuid:
                  type: string
                  format: uuid
                expected_version:
                  type: integer
                  example: 1
                photo_after:
                  type: string
                  format: binary
      responses:
        '200':
          description: Khắc phục thành công, chuyển sang PENDING_REVIEW
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '409':
          description: Xung đột trạng thái hoặc phiên bản (Optimistic Locking)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/close:
    post:
      operationId: closeIssue
      summary: Duyệt hoàn thành issue và chấm điểm Kaizen
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score_rating:
                  type: integer
                  minimum: 1
                  maximum: 5
                  default: 3
      responses:
        '200':
          description: Đóng issue thành công, cộng điểm Creator
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          description: Không đủ thẩm quyền đóng issue (ví dụ công nhân không được duyệt 6S Safety)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/reopen:
    post:
      operationId: reopenIssue
      summary: Từ chối duyệt khắc phục, yêu cầu làm lại (Reopen)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reject_reason
              properties:
                reject_reason:
                  type: string
                  example: Chưa dọn sạch dầu / Dây điện vẫn chưa bọc kỹ
      responses:
        '200':
          description: Reopen thành công, trừ điểm chuyền và bắn thông báo khẩn
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          description: Không có quyền thực hiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /issues/{id}/invalid:
    post:
      operationId: invalidateIssue
      summary: Bác bỏ issue do báo sai hoặc spam (Requires permission `issue:invalidate`)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - reason
              properties:
                reason:
                  type: string
                  example: Ảnh chụp không rõ / Báo sai thực tế
      responses:
        '200':
          description: Bác bỏ thành công, trừ điểm phạt Creator
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/Issue'
        '403':
          description: Requires permission `issue:invalidate`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /leaderboard/locations:
    get:
      operationId: getLocationLeaderboard
      summary: Lấy bảng xếp hạng sức khỏe các khu vực/chuyền sản xuất
      responses:
        '200':
          description: Danh sách sức khỏe khu vực
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/LocationHealthScore'

  /leaderboard/reporters:
    get:
      operationId: getReporterLeaderboard
      summary: Bảng vinh danh cá nhân (Top Thợ săn 6S)
      responses:
        '200':
          description: Danh sách cá nhân xuất sắc
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReporterScore'

