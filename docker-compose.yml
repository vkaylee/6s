services:
  server:
    build:
      context: .
      dockerfile: .compose/Dockerfile.golang
    image: 6s-go-dev:1.23
    working_dir: /workspace
    volumes:
      - .:/workspace
      - go-module-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - web-node-modules:/workspace/web/node_modules
    environment:
      CGO_ENABLED: "0"
      SERVER_PORT: "8080"
      DATA_DIR: "/workspace/data"
      DB_DSN: "${DB_DSN:-postgres://runtime:runtime@db:5432/6s_db?sslmode=disable}"
      JWT_SECRET: "${JWT_SECRET:-development-jwt-secret-01234567890123456789}"
      DEV_INSECURE: "${DEV_INSECURE:-1}"
    command: ["sh", "/workspace/scripts/dev-app.sh"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:8080/api/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - 6s-network


  caddy:
    image: docker.io/library/caddy:2.8.4
    ports:
      - "${CADDY_HTTP_PORT:-8080}:80"
      - "${CADDY_HTTPS_PORT:-8443}:443"
    volumes:
      - ./.compose/Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - dev-caddy-certs:/etc/caddy/certs:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - 6s-network

  db:
    image: docker.io/library/postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
      POSTGRES_DB: "${DB_NAME:-6s_db}"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-6s_db}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - 6s-network

networks:
  6s-network:

volumes:
  go-module-cache:
    name: 6s-dev-go-module-cache
  go-build-cache:
    name: 6s-dev-go-build-cache
  web-node-modules:
    name: 6s-dev-web-node-modules
  caddy-data:
    name: 6s-dev-caddy-data
  caddy-config:
    name: 6s-dev-caddy-config
  dev-caddy-certs:
    name: 6s-dev-caddy-certs
  postgres-data:
    name: 6s-dev-postgres-data
